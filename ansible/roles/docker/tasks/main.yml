- name: Update apt cache
  apt:
    update_cache: yes

- name: Install Docker prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
    state: present

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu noble stable
    state: present

- name: Install Docker
  apt:
    name: docker-ce
    state: present

- name: Start Docker service
  service:
    name: docker
    state: started
    enabled: yes
  notify: Restart Docker

- name: Pull WordPress image from Docker Hub
  docker_image:
    name: "{{ docker_image }}"
    source: pull

- name: Run WordPress container
  docker_container:
    name: wordpress_php
    image: "{{ docker_image }}"
    state: started
    restart_policy: always
    ports:
      - "9000:9000"
